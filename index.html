<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>米线 · MVP 交互原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#ece9e3;color:#292820;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:13px 18px;background:#f06b32;color:white;font-weight:650}button.secondary{background:#f0eee8;color:#555}button:disabled{opacity:.4;cursor:default}header{max-width:1080px;margin:32px auto 20px;display:flex;justify-content:space-between;align-items:center;padding:0 20px}header p{color:#777;font-size:13px}.layout{max-width:1000px;margin:auto;display:flex;gap:48px;align-items:flex-start;padding:0 20px 40px}.notes{flex:1;padding-top:30px;line-height:1.9;color:#747267}.notes h2{color:#39382f;font-size:27px}.phone{width:390px;min-height:780px;background:#faf9f5;border:8px solid #34352f;border-radius:42px;overflow:hidden;box-shadow:0 24px 70px #39342620;flex-shrink:0}.status{padding:15px 22px;font-weight:700;font-size:12px}.body{padding:12px 18px 24px}h1{font-size:28px;letter-spacing:-1px;margin:8px 0}h2{font-size:20px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.6}.muted{color:#8a887d;font-size:12px}.badge{display:inline-block;background:#e9eedf;color:#627b41;font-size:11px;border-radius:6px;padding:4px 7px}.banner{background:#f4e5d4;border-radius:20px;padding:19px;margin:20px 0}.banner strong{font-size:22px}.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.tabs button{font-size:12px;padding:9px 14px}.card{background:white;padding:16px;border-radius:18px;margin:12px 0;border:1px solid #efede7}.food{display:flex;gap:13px;align-items:center}.art{width:78px;height:88px;border-radius:14px;background:#f8ebda;display:grid;place-items:center;font-size:47px}.food .info{flex:1}.price{color:#df5d29;font-size:20px;font-weight:700}.tag{font-size:10px;color:#b17c48;margin:7px 0 14px}.add{padding:5px 11px;font-size:21px;border-radius:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.bottom{background:#34392e;color:white;border-radius:17px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;margin-top:22px}.nav{display:flex;justify-content:space-around;border-top:1px solid #e7e5dc;margin-top:22px;padding-top:16px}.nav button{color:#777;background:none;padding:8px}.nav .active{color:#df5d29}.full{width:100%;margin-top:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #e6e3da;border-radius:10px;background:white;margin:7px 0 12px}label{font-size:13px;color:#666}.total{font-size:27px;font-weight:750}.timeline{border-left:2px solid #eadfce;padding-left:20px;line-height:2.3}.alert{font-size:12px;line-height:1.8;background:#fff2de;color:#966327;padding:12px;border-radius:12px}.qr{width:180px;height:180px;margin:24px auto;background:repeating-conic-gradient(#dfdcd3 0% 25%,white 0% 50%) 0 / 20px 20px;display:grid;place-items:center;border:12px solid white;outline:1px solid #eee}.qr span{background:white;padding:12px;font-weight:700;color:#8a887d}.link{background:none;color:#888;padding:10px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#30362e;color:white;border-radius:12px;padding:14px 24px;z-index:10}dialog{border:0;border-radius:22px;padding:24px;max-width:350px;width:90%;box-shadow:0 20px 90px #0004}dialog::backdrop{background:#0005}@media(max-width:700px){.notes{display:none}.layout{padding:0;justify-content:center}.phone{width:100%;max-width:410px;border:0;border-radius:24px;min-height:90vh}header{margin:14px auto}header p{display:none}}
</style><header><div><b>米线 MIXIAN</b><p>校内的一碗热乎 · 交互原型 v0.1</p></div><select id="role" style="width:170px" onchange="switchRole(this.value)"><option value="user">用户端预览</option><option value="merchant">商家端预览</option><option value="rider">骑手端预览</option></select></header><div class="layout"><div class="phone"><div class="status row"><span>9:41</span><span>●●● ▰</span></div><main class="body" id="app"></main></div><aside class="notes"><h2>吃好这一餐，<br>剩下的交给我们。</h2><p>暖白、米线橙、清晰的订单状态。<br>一套小程序，三种工作界面。</p><p>体验路径：添加餐品 → 确认订单 → 模拟转账 → 商家核款 → 骑手接单 → 确认送达。</p><p>也可以在核款前取消订单，查看人工退款提示。</p><p>右上角角色切换仅用于评审原型，正式小程序不会向用户显示管理入口。二维码入口与密码登录在正式开发阶段实现。</p><p>这是独立演示，不连接微信、不收款、不部署云开发。收款码为不可支付的占位图，刷新页面会重置数据。</p><button class="secondary" onclick="location.reload()">重置演示</button></aside></div><dialog id="modal"></dialog><script>
const products=[{name:'招牌鲜汤米线',price:16,tag:'每日熬汤 · 人气推荐',icon:'🍜'},{name:'番茄肥牛米线',price:22,tag:'酸甜浓汤 · 满满肥牛',icon:'🍅'},{name:'菌菇鸡汤米线',price:19,tag:'鲜香清爽 · 轻负担',icon:'🍄'}];let role='user',page='menu',cart=[0,0,0],order=null,seq=11,method='now',slot='',address='',phone='',person='',note='';const app=document.querySelector('#app');const money=()=>cart.reduce((s,n,i)=>s+n*products[i].price,0);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}function switchRole(r){role=r;page=r==='user'?'menu':'orders';render()}function nav(){return `<div class="nav"><button class="${page==='menu'?'active':''}" onclick="page='menu';render()">点餐</button><button class="${page==='orders'?'active':''}" onclick="page='orders';render()">我的订单</button></div>`}function items(a){return a.map(x=>`<div class="row"><p>${esc(x.name)} <span class="muted">标准份 ×${x.n}</span></p><b>¥${x.price*x.n}</b></div>`).join('')}function slots(){let d=new Date(Date.now()+40*60000);d.setSeconds(0,0);d.setMinutes(Math.ceil(d.getMinutes()/30)*30);let a=[];for(let i=0;i<6;i++){let end=new Date(+d+30*60000);let fmt=x=>x.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Shanghai'});a.push(fmt(d)+'–'+fmt(end));d=end}return a}function render(){if(role!=='user'){dashboard();return}if(page==='menu'){app.innerHTML=`<span class="badge">营业中 · 欢迎同学</span><h1>今天，嗦碗好米线</h1><div class="muted">现做现送 · 默认约 40 分钟 · 配送费 ¥0</div><div class="banner"><div class="muted">一人食，也认真对待</div><strong>一碗鲜汤，刚刚好。</strong><p style="margin-bottom:0">热气腾腾，送到你身边 🍜</p></div><div class="row"><h3>店长推荐</h3><span class="muted">3 款好味</span></div>${products.map((p,i)=>`<div class="card food"><div class="art">${p.icon}</div><div class="info"><h3>${p.name}</h3><div class="tag">${p.tag}</div><div class="row"><span class="price">¥${p.price}</span><div>${cart[i]?`<button class="secondary add" onclick="cart[${i}]--;render()">−</button> ${cart[i]} `:''}<button class="add" onclick="cart[${i}]++;render()">+</button></div></div></div></div>`).join('')}<div class="bottom"><span>合计 <b>¥${money()}</b></span><button ${money()?'':'disabled'} onclick="page='checkout';render()">去结算</button></div>${nav()}`;return}if(page==='checkout'){let options=slots();app.innerHTML=`<button class="link" onclick="page='menu';render()">← 返回点餐</button><h1>确认这一餐</h1><div class="card"><h3>送到哪里</h3><label>收货人</label><input id="person" placeholder="怎么称呼你" value="${esc(person)}"><label>联系电话</label><input id="phone" inputmode="tel" placeholder="请输入 11 位手机号" value="${esc(phone)}"><label>收货地址</label><textarea id="address" placeholder="例如：东区 3 号宿舍 502，请送到宿舍门口">${esc(address)}</textarea></div><div class="card"><h3>配送时间</h3><select id="method" onchange="remember();method=this.value;render()"><option value="now" ${method==='now'?'selected':''}>立即配送 · 预计约 40 分钟</option><option value="book" ${method==='book'?'selected':''}>预约配送</option></select>${method==='book'?`<select id="slot">${options.map(x=>`<option ${slot===x?'selected':''}>${x}</option>`).join('')}</select>`:''}<div class="muted">原型时段按当前时间生成；营业时间规则待业务实现。</div></div><div class="card">${items(cart.map((n,i)=>({...products[i],n})).filter(x=>x.n))}<div class="row"><p>配送费</p><b>¥0</b></div><label>备注（可选）</label><input id="note" placeholder="口味或交接说明" value="${esc(note)}"></div><div class="row"><span>实付金额</span><span class="total">¥${money()}</span></div><button class="full" onclick="pay()">确认，查看收款码</button>`;return}if(page==='pay'){app.innerHTML=`<button class="link" onclick="page='checkout';render()">← 返回确认订单</button><h1>扫码转账</h1><p class="muted">转账完成后，请点击下方「我已支付」</p><div class="card" style="text-align:center"><p>请向商家转账</p><div class="total">¥${money()}</div><div class="qr"><span>演示占位<br>不可支付</span></div><p class="muted">正式版本此处展示商家静态收款码</p></div><div class="alert">本原型不收款。点击下方按钮模拟声明已转账；正式订单仍需商家人工核款。</div><button class="full" onclick="create()">我已支付 · 提交订单</button>`;return}userOrder()}
function remember(){for(let k of ['person','phone','address','note','slot']){let el=document.getElementById(k);if(el){if(k==='person')person=el.value;if(k==='phone')phone=el.value;if(k==='address')address=el.value;if(k==='note')note=el.value;if(k==='slot')slot=el.value}}}function pay(){remember();if(!person.trim()||!address.trim()||!/^1\d{10}$/.test(phone)){toast('请填写姓名、完整地址及有效手机号');return}page='pay';render()}function create(){if(order&&!['已完成','已取消'].includes(order.status)){toast('请先处理当前演示订单');return}order={id:++seq,status:'待核款',amount:money(),items:cart.map((n,i)=>({...products[i],n})).filter(x=>x.n),address,phone,person,note,time:method==='now'?'立即配送 · 预计约 40 分钟':`预约送达 ${slot||slots()[0]}`,events:['用户声明已转账，订单已创建']};cart=[0,0,0];page='orders';render()}function detail(){return `<div class="card"><div class="row"><h3>#${order.id} <span class="muted">今日流水号</span></h3><span class="badge">${order.status}</span></div><p>${esc(order.time)}</p><h3>${esc(order.person)} · ${esc(order.phone)}</h3><p>${esc(order.address)}</p>${order.note?`<p class="muted">备注：${esc(order.note)}</p>`:''}</div><div class="card">${items(order.items)}<div class="row"><span>含配送费 ¥0</span><b>合计 ¥${order.amount}</b></div></div><div class="card"><h3>订单进度</h3><div class="timeline">${order.events.map(x=>`<div>✓ ${esc(x)}</div>`).join('')}</div></div>`}function userOrder(){app.innerHTML=`<h1>我的订单</h1>${!order?'<div class="card"><h3>还没有订单</h3><p class="muted">去选一碗喜欢的米线吧。</p></div>':detail()+ (order.status==='待核款'?'<div class="alert">等待商家核对转账，核款前可以取消订单。</div><button class="secondary full" onclick="askCancel()">取消订单</button>':'')+(order.status==='已取消'?'<div class="alert">订单已取消。已转账不会自动退款，请联系商家线下处理。</div>':'')}${nav()}`}function dashboard(){app.innerHTML=`<span class="badge">${role==='merchant'?'商家工作台':'骑手工作台'} · 演示已登录</span><h1>${role==='merchant'?'每一单，都照顾好':'把热乎送到手'}</h1><p class="muted">${role==='merchant'?'核对收款后，订单才进入待配送':'仅已核款且到达配送窗口的订单可接单'}</p>${!order?'<div class="card">暂无订单，请先切换用户端下单。</div>':role==='rider'&&order.status==='待核款'?'<div class="card">暂无可接订单，等待商家核款。</div>':detail()}${order?actions():''}<p class="muted">该原型主要展示订单闭环，商品管理、骑手账号与店铺设置将在后续页面原型中补充。</p>`}function actions(){if(role==='merchant'&&order.status==='待核款')return '<button class="full" onclick="confirmCheck()">已核对收款</button>';if(role==='merchant'&&order.status==='已取消')return '<div class="alert">用户已取消，用户曾声明转账，请人工核查是否需要线下退款。</div>';if(role==='rider'&&order.status==='待配送')return '<button class="full" onclick="transition(\'配送中\',\'演示骑手已接单\')">接下这一单</button>';if(role==='rider'&&order.status==='配送中')return '<button class="full" onclick="modal(\'确认送达？\',\'请确认餐品已交给收货人。\',()=>transition(\'已完成\',\'骑手确认送达\'))">确认送达</button>';return ''}function transition(s,event){order.status=s;order.events.push(event);render()}function modal(title,text,fn){let d=document.querySelector('#modal');d.innerHTML=`<h2>${title}</h2><p>${text}</p><div class="row"><button class="secondary" id="no">再想想</button><button id="yes">确认</button></div>`;d.querySelector('#no').onclick=()=>d.close();d.querySelector('#yes').onclick=()=>{d.close();fn()};d.showModal()}function askCancel(){modal('取消这份订单？','取消后无法恢复。若已转账，不会自动退款，请联系商家线下处理。',()=>{if(order.status!=='待核款'){toast('状态已变更，请刷新');return}transition('已取消','用户在核款前取消订单')})}function confirmCheck(){modal('确认已经收到转账？','请核对实际到账金额与订单金额一致，再确认。',()=>transition('待配送','商家已核对收款'))}render();
</script></html>
